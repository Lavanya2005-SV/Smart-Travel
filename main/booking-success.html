<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef6ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#fff;
padding:40px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.1);
width:420px;
}

.box i{
font-size:70px;
color:#28a745;
margin-bottom:20px;
}

.box h2{
color:#0077b6;
margin-bottom:15px;
}

.box p{
color:#555;
margin-bottom:25px;
}

.box a{
display:inline-block;
padding:12px 30px;
background:#0077b6;
color:#fff;
text-decoration:none;
border-radius:30px;
}

.box a:hover{
background:#005f92;
}

</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="box">

<i class="fa-solid fa-circle-check"></i>

<h2>Booking Confirmed!</h2>

<p>
Thank you for choosing <strong>SmartTravel</strong>.<br>
Your booking request has been received successfully.
</p>

<a href="index.html">Back to Home</a>

</div>

</body>
</html>
